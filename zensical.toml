[project]
site_name = "Sledge"
site_url = "READTHEDOCS_URL_PLACEHOLDER"
site_description = "A modification and modding tool for Red Faction: Guerrilla Re-Mars-tered."
site_author = "arrowsv"
repo_url = "https://github.com/arrowsv/sledge"

[project.theme]
logo = "assets/icon.png"
favicon = "assets/icon.png"
features = [
    "navigation.sections",
    "navigation.top",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.footer",
    "navigation.indexes",
    "navigation.path",
    "content.code.copy"
]

[[project.theme.palette]] 
scheme = "default"
primary = "deep orange"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "orange"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
def_list = {}
toc.permalink = "🔗"
pymdownx.tabbed.alternate_style = true
pymdownx.highlight = {}
pymdownx.details = {}
pymdownx.superfences = {}
attr_list = {}
tables = {}
md_in_html = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"

[project.plugins.awesome-nav]