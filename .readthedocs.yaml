version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: latest
  jobs:
    install:
      - pip install -r docs/requirements.txt
    build:
      html:
        - sed -i "s|READTHEDOCS_URL_PLACEHOLDER|$READTHEDOCS_CANONICAL_URL|g" zensical.toml
        - zensical build
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/